<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizNova live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"></noscript>
<link rel="stylesheet" href="nova.css?v=bcdd0d0d">
<style>
.stage{max-width:1300px;margin:0 auto;padding:24px 22px 60px}

/* lobby */
.pin-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:center;padding:34px}
.pin-big{font-size:clamp(3.2rem,9vw,5.6rem);font-weight:900;letter-spacing:.16em;line-height:1;
  background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.join-url{font-size:1.15rem;font-weight:700}
.mini-face{display:inline-flex;line-height:0;vertical-align:middle}
.mode-badge{display:inline-flex;gap:9px;align-items:center;padding:9px 16px;border-radius:99px;font-weight:750;font-size:.9rem}
.mode-normal{background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.45);color:#cfc4ff}
.mode-laser{background:rgba(255,77,94,.16);border:1px solid rgba(255,77,94,.45);color:#ffb3ba}

.players{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.pchip{display:flex;gap:9px;align-items:center;padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);font-weight:650;animation:popIn .35s var(--ease) both;font-size:.92rem}
@keyframes popIn{from{opacity:0;transform:scale(.8) translateY(8px)}}
.pchip.red{border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.12)}
.pchip.blue{border-color:rgba(79,107,255,.5);background:rgba(79,107,255,.12)}
.pchip .av{font-size:1.15rem}

/* the board, sized for the back row of a classroom */
.board,.lobby{display:flex;flex-direction:column;gap:14px;height:calc(100vh - 128px);min-height:520px}
.joinbar{flex:none;display:flex;align-items:center;gap:30px;background:#fff;color:#161036;border:3px solid #0b0718;
  border-radius:24px;padding:16px 26px;box-shadow:0 13px 0 -3px rgba(0,0,0,.5)}
.lobby-art{flex:none;line-height:0;border-radius:16px;overflow:hidden;border:3px solid #0b0718}
.lobby-art svg{display:block}
.joinbar .lab{font-size:.66rem;letter-spacing:.17em;text-transform:uppercase;font-weight:800;opacity:.5}
.joinbar .where{font-size:clamp(.95rem,1.6vw,1.35rem);font-weight:850;line-height:1.18;word-break:break-word}
.pinhuge{font-size:clamp(2.4rem,6.6vw,5rem);font-weight:900;letter-spacing:.1em;line-height:1.05}
.qrbox{flex:none;background:#fff;border-radius:12px}
.crowd{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px}
.face{display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:99px;font-weight:800;
  font-size:clamp(1rem,1.4vw,1.3rem);background:rgba(255,255,255,.08);border:2px solid var(--line);
  animation:popIn .35s var(--ease) both}
.face.red{border-color:rgba(255,77,94,.55);background:rgba(255,77,94,.14)}
.face.blue{border-color:rgba(79,107,255,.55);background:rgba(79,107,255,.14)}
.face .av{font-size:1.5rem}
.nobody{margin:auto;text-align:center;opacity:.6;font-size:1.1rem}
.lobbybar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ask{background:#fff;color:#161036;border:3px solid #0b0718;border-radius:24px;padding:20px 28px;
  display:flex;align-items:center;gap:24px;box-shadow:0 13px 0 -3px rgba(0,0,0,.5)}
.ask h1{flex:1;text-align:center;font-size:clamp(1.6rem,4.2vw,3.4rem);line-height:1.14;
  font-weight:850;letter-spacing:-.02em;margin:0}
.dial{position:relative;flex:none;width:clamp(80px,7.4vw,116px);aspect-ratio:1}
.dial > svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .num svg{width:auto;height:auto;transform:none}
.dial .num{position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(1.7rem,2.6vw,2.6rem);font-weight:900;color:#161036}
.dial.low .num{color:#F4364C}
.dial.low{animation:pulseLow .9s infinite}
@keyframes pulseLow{50%{transform:scale(1.06)}}
.tally{flex:none;text-align:center;min-width:88px}
.tally b{display:block;font-size:clamp(1.6rem,2.4vw,2.4rem);font-weight:900;line-height:1}
.tally span{font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;opacity:.5;font-weight:800}

.grid4{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:15px;min-height:0}
.grid4.one{grid-template-columns:1fr}
.tile{position:relative;display:flex;align-items:center;gap:20px;padding:18px 26px;border-radius:22px;
  background:var(--c);color:#fff;border:3px solid rgba(0,0,0,.42);overflow:hidden;
  box-shadow:0 11px 0 -3px rgba(0,0,0,.45);transition:opacity .4s,transform .4s,filter .4s;
  animation:tileIn .34s var(--ease) both}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.tile .sh{flex:none;width:clamp(34px,3vw,52px);display:grid;place-items:center}
.tile .sh svg{width:100%;height:auto;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.tile .lbl{flex:1;font-size:clamp(1.05rem,2.1vw,2rem);font-weight:800;line-height:1.16}
.tile .n{flex:none;font-size:clamp(.95rem,1.5vw,1.5rem);font-weight:900;opacity:.92}
.tile .fill{position:absolute;left:0;bottom:0;height:9px;width:0;background:rgba(255,255,255,.9);
  transition:width .85s var(--ease)}
.tile .tick{flex:none;font-size:clamp(1.1rem,1.7vw,1.7rem);opacity:0;transform:scale(.4);transition:.4s var(--ease)}
.tile.miss{opacity:.26;transform:scale(.975);filter:saturate(.35)}
.tile.hit{animation:hitPop .55s var(--ease)}
.tile.hit .tick{opacity:1;transform:scale(1)}
@keyframes hitPop{45%{transform:scale(1.03)}}
.board.result .grid4{flex:none;grid-auto-rows:minmax(50px,auto)}
.board.result .ask{padding:12px 24px}
.board.result .ask h1{font-size:clamp(1.2rem,2.6vw,2.1rem)}
.board.result .tile{padding:12px 22px}
.board .rest{flex:none}
.board.result .rest{flex:1;min-height:0;overflow:auto;padding-bottom:4px}
.why{margin:0;font-size:1rem;font-weight:600;opacity:.8;text-align:center}

/* ── the arena, in three dimensions ───────────────────────
 * One floor, tilted away from the viewer, with everything standing on it.
 * Each figure is counter-rotated by the same angle so it stands upright while
 * the ground runs away into the distance, which is what makes it read as depth
 * rather than as a flat picture of depth. */
.stage3d{position:relative;height:100%;min-height:300px;perspective:1100px;perspective-origin:50% 34%}
.world{position:absolute;inset:6% 4% 4%;transform-style:preserve-3d;transform:rotateX(58deg);border-radius:26px}
.floor{position:absolute;inset:0;border-radius:26px;overflow:hidden;
  background:var(--floor,linear-gradient(180deg,#2A2547,#151129));
  box-shadow:inset 0 0 90px rgba(0,0,0,.55),0 40px 70px -30px rgba(0,0,0,.9)}
.floor::after{content:'';position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px),
                   linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:6.25% 12.5%}
.floor .line{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.22)}
.floor .finish{position:absolute;top:0;bottom:0;width:12px;
  background:repeating-linear-gradient(180deg,#fff 0 10px,#241C38 10px 20px)}
.figure{position:absolute;bottom:0;transform-style:preserve-3d;transform:rotateX(-58deg);
  transform-origin:bottom center;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:left .9s var(--ease),bottom .9s var(--ease)}
.figure .tag{font-size:.72rem;font-weight:800;white-space:nowrap;padding:2px 7px;border-radius:99px;
  background:rgba(10,7,20,.72);border:1px solid rgba(255,255,255,.16)}
.figure .shadow{position:absolute;bottom:-4px;width:70%;height:8px;border-radius:50%;
  background:rgba(0,0,0,.45);filter:blur(2px);transform:rotateX(58deg)}
.figure.lead .tag{background:var(--sun);color:#1b1330;border-color:#0b0718}
.pillar{width:34px;border-radius:6px 6px 0 0;background:var(--c,#7C4DFF);
  box-shadow:inset -6px 0 0 rgba(0,0,0,.22),0 0 18px rgba(0,0,0,.35);transition:height .8s var(--ease)}
.beam{position:absolute;height:7px;border-radius:4px;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(255,197,61,.25),#FFC53D,#FF7A45);
  box-shadow:0 0 22px rgba(255,197,61,.85);animation:fire .45s var(--ease) both}
@keyframes fire{from{transform:scaleX(.05) rotate(var(--a));opacity:0}}

/* maps: the same arena, dressed differently */
.map-hall,.map-arena,.map-city,.map-site,.map-cave,.map-lair{--floor:linear-gradient(180deg,#2A2547,#151129)}
.map-space{--floor:linear-gradient(180deg,#131A4A,#05060F)}
.map-jungle{--floor:linear-gradient(180deg,#123D2B,#07160F)}
.map-bunker{--floor:linear-gradient(180deg,#3A3730,#16150F)}
.map-moon{--floor:linear-gradient(180deg,#3C4258,#0E1119)}
.map-desert{--floor:linear-gradient(180deg,#6A4A22,#2A1B0B)}
.map-ice{--floor:linear-gradient(180deg,#1E5570,#081E2B)}
.map-candy{--floor:linear-gradient(180deg,#6B2350,#260C1D)}
.map-castle{--floor:linear-gradient(180deg,#3E3A2E,#171510)}
.map-beach{--floor:linear-gradient(180deg,#7A6132,#241C0D)}
.map-vault{--floor:linear-gradient(180deg,#243A5E,#0A1120)}
.map-volcano{--floor:linear-gradient(180deg,#5E1F16,#1C0806)}
.map-ruins{--floor:linear-gradient(180deg,#33452F,#101710)}
.scene.map-space{filter:hue-rotate(200deg) saturate(.9)}
.scene.map-jungle{filter:hue-rotate(80deg) saturate(1.2)}
.scene.map-bunker{filter:saturate(.5) brightness(.92)}
.scene.map-moon{filter:hue-rotate(215deg) saturate(.6)}
.scene.map-desert{filter:hue-rotate(-25deg) saturate(1.3)}
.scene.map-ice{filter:hue-rotate(160deg) saturate(.8) brightness(1.08)}
.scene.map-candy{filter:hue-rotate(295deg) saturate(1.3)}
.scene.map-castle{filter:hue-rotate(30deg) saturate(.7)}
.scene.map-beach{filter:hue-rotate(35deg) saturate(1.2)}
.scene.map-vault{filter:hue-rotate(210deg) saturate(.85)}
.scene.map-volcano{filter:hue-rotate(-40deg) saturate(1.4)}
.scene.map-ruins{filter:hue-rotate(60deg) saturate(.6)}

/* the arena on the big screen */
.arena-board{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;
  border:3px solid #0b0718;box-shadow:0 22px 50px -24px rgba(0,0,0,.9)}
.arena-board canvas{position:absolute;inset:0;display:block;width:100%;height:100%}

/* laser arena */
.arena{display:grid;grid-template-columns:1fr 74px 1fr;gap:14px;align-items:stretch;margin-top:18px}
.team{padding:18px;border-radius:var(--r-lg);border:1px solid var(--line);background:rgba(255,255,255,.03)}
.team.red{border-color:rgba(255,77,94,.4);background:linear-gradient(180deg,rgba(255,77,94,.13),rgba(255,77,94,.03))}
.team.blue{border-color:rgba(79,107,255,.45);background:linear-gradient(180deg,rgba(79,107,255,.13),rgba(79,107,255,.03))}
.hpbar{height:16px;border-radius:99px;background:rgba(0,0,0,.42);overflow:hidden;margin:10px 0 14px;border:1px solid rgba(255,255,255,.09)}
.hpbar i{display:block;height:100%;transition:width .7s var(--ease)}
.team.red .hpbar i{background:linear-gradient(90deg,#ff4d5e,#ff9b6a)}
.team.blue .hpbar i{background:linear-gradient(90deg,#4f6bff,#22d3ee)}
.fighter{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:11px;margin-bottom:6px;background:rgba(0,0,0,.22)}
.fighter.down{opacity:.42;filter:grayscale(1)}
.fighter .mini{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.fighter .mini i{display:block;height:100%;background:var(--mint);transition:width .5s}
.hit{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.vs{display:grid;place-items:center;font-weight:900;font-size:1.5rem;color:var(--faint);position:relative}
.beam{position:absolute;height:4px;width:100%;background:linear-gradient(90deg,transparent,#fff,transparent);
  border-radius:99px;opacity:0;box-shadow:0 0 22px 5px rgba(255,255,255,.6)}
.beam.fire{animation:beam .55s ease-out}
@keyframes beam{0%{opacity:0;transform:scaleX(.2)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0}}
.feed{margin-top:14px;padding:12px 16px;border-radius:var(--r-md);background:rgba(0,0,0,.3);border:1px solid var(--line);
  font-size:.87rem;min-height:52px}
.feed div{padding:3px 0;animation:fadeUp .3s var(--ease) both;color:var(--muted)}

/* kart race */
.track{margin-top:18px;padding:18px;border-radius:var(--r-lg);border:2.5px solid var(--line);background:rgba(0,0,0,.28)}
.lane{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.lane .who{width:120px;font-weight:800;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .road{position:relative;flex:1;height:34px;border-radius:99px;background:rgba(255,255,255,.07);
  border:2px dashed rgba(255,255,255,.18);overflow:hidden}
.lane .road::after{content:'';position:absolute;inset:0 0 0 auto;width:6px;
  background:repeating-linear-gradient(180deg,#fff 0 6px,#111 6px 12px)}
.lane .kart{position:absolute;top:3px;font-size:1.5rem;transition:left 1s var(--ease);transform:translateX(-50%)}
.lane .kart.boost{filter:drop-shadow(0 0 10px #FFC53D)}
.lane .m{width:64px;text-align:right;font-weight:800;font-size:.82rem;color:var(--muted)}

/* tower build */
.skyline{display:flex;gap:16px;align-items:flex-end;justify-content:center;margin-top:18px;padding:18px 12px;
  min-height:220px;border-radius:var(--r-lg);border:2.5px solid var(--line);background:rgba(0,0,0,.28)}
.tower{display:flex;flex-direction:column;align-items:center;gap:5px}
.tower .stack{display:flex;flex-direction:column-reverse;gap:3px;min-height:8px}
.tower .blk{width:46px;height:16px;border-radius:5px;border:2px solid rgba(0,0,0,.45);
  animation:drop .35s var(--bounce) both}
@keyframes drop{from{transform:translateY(-22px);opacity:0}}
.tower .cap{font-size:1.3rem}
.tower .who{font-size:.78rem;font-weight:800;margin-top:4px;max-width:74px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center}

/* treasure run */
.chests{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.chest{padding:14px;border-radius:var(--r-lg);border:2.5px solid var(--line);background:rgba(255,197,61,.12);
  text-align:center}
.chest .coins{font-size:1.7rem;font-weight:900;color:#FFC53D}
.chest .tag{font-size:.72rem;font-weight:800;color:var(--mint);min-height:14px}

/* boss battle */
.boss{margin-top:18px;padding:22px;border-radius:var(--r-lg);border:2.5px solid var(--line);
  background:linear-gradient(180deg,rgba(244,54,76,.2),rgba(0,0,0,.35));text-align:center}
.boss .face{font-size:4rem;animation:bob 3s ease-in-out infinite}
.boss.hurt .face{animation:shake .4s}
.boss h2{font-size:1.5rem;margin:6px 0 12px}
.boss .bar{height:22px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;border:2px solid rgba(255,255,255,.15)}
.boss .bar i{display:block;height:100%;background:linear-gradient(90deg,#F4364C,#FF9A3D);transition:width .7s var(--ease)}
.classbar{height:14px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:14px;
  border:2px solid rgba(255,255,255,.15)}
.classbar i{display:block;height:100%;background:var(--grad-mint);transition:width .7s var(--ease)}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;gap:13px;align-items:center;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);transition:.5s var(--ease)}
.lb-row .rank{width:26px;font-weight:800;color:var(--faint)}
.lb-row.top{background:linear-gradient(90deg,rgba(255,200,87,.2),rgba(255,255,255,.04));border-color:rgba(255,200,87,.45)}
.lb-row .score{margin-left:auto;font-weight:800;font-size:1.05rem}

.finale{display:flex;flex-direction:column;gap:16px;height:calc(100vh - 128px);min-height:520px}
.crown{flex:none;background:#fff;color:#161036;border:3px solid #0b0718;border-radius:24px;padding:20px 28px;
  text-align:center;box-shadow:0 13px 0 -3px rgba(0,0,0,.5)}
.crown h1{font-size:clamp(1.6rem,4vw,3rem);font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.12}
.crown p{margin:6px 0 0;font-weight:600;opacity:.6}
.podium{flex:none;display:flex;gap:16px;align-items:flex-end;justify-content:center;margin:20px 0 8px;
  position:relative}
/* the places arrive one at a time, each in its own light */
.podium .stand{opacity:0;transform:translateY(26px)}
.podium .stand.up{opacity:1;transform:none;transition:opacity .5s var(--ease),transform .6s var(--bounce)}
.podium .stand .spot{position:absolute;left:50%;bottom:100%;width:190px;height:230px;margin-left:-95px;
  pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.30));
  clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);filter:blur(3px)}
.podium .stand.up .spot{animation:lampOn .9s var(--ease) forwards}
@keyframes lampOn{0%{opacity:0}40%{opacity:1}100%{opacity:.55}}
.crown{transition:opacity .4s}
.crown.hush{opacity:.35}
.stand{width:150px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;padding:16px 12px;text-align:center;animation:rise .8s var(--ease) both}
@keyframes rise{from{transform:scaleY(.2);opacity:0;transform-origin:bottom}}
.stand.p1{height:min(280px,34vh);background:linear-gradient(180deg,#FFE08A,#FFC53D);border:3px solid #0b0718}
.stand.p2{height:min(215px,26vh);background:linear-gradient(180deg,#E6EAF5,#BFC7DA);border:3px solid #0b0718}
.stand.p3{height:min(175px,21vh);background:linear-gradient(180deg,#F0BD8B,#D08C4B);border:3px solid #0b0718}
.stand.p1,.stand.p2,.stand.p3{color:#161036;box-shadow:0 11px 0 -3px rgba(0,0,0,.45)}
.stand .medal{font-size:2.2rem;line-height:1}
.stand .who{font-size:clamp(1rem,1.5vw,1.35rem);font-weight:900;margin-top:4px}
.stand .pts{font-weight:800;opacity:.66;font-size:.95rem}
.finale .rest{flex:1;min-height:0;overflow:auto}
.lb-row .move{font-weight:800;font-size:.85rem;width:34px;text-align:right}
.lb-row .move.up{color:#12BE8E}.lb-row .move.down{color:#FF8A9B}.lb-row .move.same{opacity:.3}

@media (max-width:900px){
  .pin-panel{grid-template-columns:1fr}
  .answers{grid-template-columns:1fr}
  .arena{grid-template-columns:1fr;gap:10px}
  .vs{height:36px}
}
</style>
</head>
<body class="dark">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><div class="brand-mark" id="brand-mark"></div><div>QuizNova<small id="qt">live game</small></div></a>
    <div class="grow"></div>
    <span class="chip" id="conn"><span class="dot"></span> live</span>
    <span class="chip" id="count">0 players</span>
    <span class="chip mono" id="pinchip">------</span>
    <button class="btn sm danger" id="end">End game</button>
  </div>
</header>

<main class="stage" id="stage"></main>

<script src="sprites.js?v=50ac52cf"></script>

<script src="nova.js?v=67dabb23"></script>
<script src="quizbank.js?v=9c4f8a9a"></script>
<script src="realtime.js?v=75e1623c"></script>
<script src="arena.js?v=134a5fcf"></script>
<script src="live.js?v=bd2138d7"></script>
<script src="nova-local.js?v=a1acb008"></script>
<script src="qr.js?v=b8307384"></script>
<script>
const { $, api, el, esc, qs, toast, stream, store, confetti, SHAPES, copy, modal } = Nova;
const pin = qs('pin');
const hostToken = store.get('host:' + pin);
let game = null, drift = 0, ticker = null, lastState = '', lastHp = {};

/* Where students join. Kept as two small functions because the GitHub Pages build
 * rewrites them to folder-relative addresses — everything else stays identical. */
const joinUrl = () => location.href.replace(/[^/]*$/, '') + 'play.html?pin=' + pin;
const joinLabel = () => joinUrl().replace(/^https?:\/\//, '').replace(/\?.*$/, '');

const mark = document.getElementById('brand-mark');
if (mark) mark.innerHTML = Sprite.icon('spark', 20, '#fff');
if (!pin) location.href = 'index.html';
if (!hostToken) toast('You are watching this game. Only the teacher device can control it.', 'bad');

function connect() {
  stream(`/games/${pin}/events`, (msg) => {
    if (msg.data && msg.data.pin) apply(msg.data);
    else if (msg.event === 'hello' && msg.data?.error) fail();
  }, `/games/${pin}`);
}

function fail() {
  $('#stage').innerHTML = `<div class="card pad empty"><span class="em">${Sprite.icon('ghost', 48)}</span>
    That game is no longer running.<br><a class="btn sm" style="margin-top:16px" href="index.html">Back to quizzes</a></div>`;
}

function apply(state) {
  game = state;
  drift = state.serverNow - Date.now();
  $('#qt').textContent = state.quizTitle;
  $('#pinchip').textContent = state.pin;
  $('#count').textContent = state.players.length + ' player' + (state.players.length === 1 ? '' : 's');
  document.body.classList.toggle('laser', state.mode === 'laser');
  const key = state.state + ':' + state.index;
  render(key !== lastState);
  lastState = key;
}

/* A poll every second used to throw the whole board away and build a new one.
 * Nothing could animate — a kart was created at its new position rather than
 * driving there, and every tower block replayed its drop — which is what made
 * the game look like it was stuttering. So we build the new board off-screen and
 * copy only the differences onto the live one: unchanged nodes are never touched,
 * and a changed style is a real change to an existing element, which is what CSS
 * transitions need to animate. Nodes marked data-static (the QR code, the
 * countdown ring) own themselves and are left alone entirely. */
function morph(cur, next) {
  if (cur.hasAttribute && cur.hasAttribute('data-static')) return;
  for (const a of Array.from(cur.attributes)) if (!next.hasAttribute(a.name)) cur.removeAttribute(a.name);
  for (const a of Array.from(next.attributes)) if (cur.getAttribute(a.name) !== a.value) cur.setAttribute(a.name, a.value);
  const cs = Array.from(cur.childNodes), ns = Array.from(next.childNodes);
  for (let i = 0; i < Math.max(cs.length, ns.length); i++) {
    const c = cs[i], x = ns[i];
    if (!x) { c.remove(); continue; }
    if (!c) { cur.append(x); continue; }
    if (c.nodeType === 3 && x.nodeType === 3) { if (c.nodeValue !== x.nodeValue) c.nodeValue = x.nodeValue; continue; }
    if (c.nodeType !== 1 || x.nodeType !== 1 || c.tagName !== x.tagName) { c.replaceWith(x); continue; }
    morph(c, x);
  }
}

/** Draw `build()` into `host`, morphing onto what is already there unless the
 *  screen genuinely changed (new question, new phase). */
function paint(host, build, fresh) {
  const before = seats();
  const next = build();
  if (fresh || !host.firstElementChild) { host.innerHTML = ''; host.append(next); slide(before); return true; }
  morph(host.firstElementChild, next);
  slide(before);
  return false;
}

/* When the scores change the table reorders, and a row that simply appears in its
 * new place tells nobody anything. So: note where every row is, let the update
 * happen, then start each row from where it used to be and let it travel. The
 * browser does the moving; we only hand it the distance. */
function seats() {
  const map = new Map();
  document.querySelectorAll('.lb-row[data-id]').forEach(node => {
    map.set(node.dataset.id, {
      top: node.getBoundingClientRect().top,
      score: node.querySelector('.score') ? node.querySelector('.score').textContent : null
    });
  });
  return map;
}

/* A score that jumps from 108 to 227 is just a different number. Counting it up
 * is how a child sees they gained something. */
function countUp(node, fromText, toText) {
  const from = parseFloat(String(fromText).replace(/[^0-9.-]/g, ''));
  const to = parseFloat(String(toText).replace(/[^0-9.-]/g, ''));
  if (!isFinite(from) || !isFinite(to) || from === to) return;
  const suffix = String(toText).replace(/^-?[\d.,]+/, '');
  const started = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - started) / 700);
    const eased = 1 - Math.pow(1 - t, 3);
    node.textContent = Math.round(from + (to - from) * eased) + suffix;
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function slide(before) {
  if (!before.size) return;
  document.querySelectorAll('.lb-row[data-id]').forEach(node => {
    const was = before.get(node.dataset.id);
    if (!was) return;
    const shift = was.top - node.getBoundingClientRect().top;
    if (Math.abs(shift) >= 2) {
      node.animate([{ transform: `translateY(${shift}px)` }, { transform: 'none' }],
                   { duration: 520, easing: 'cubic-bezier(.2,.9,.25,1)' });
    }
    const score = node.querySelector('.score');
    if (score && was.score !== null) countUp(score, was.score, score.textContent);
  });
}

function render(fresh) {
  const stage = $('#stage');
  if (game.state === 'lobby') { if (paint(stage, lobbyView, fresh)) bindLobby(); return; }
  if (game.state === 'over')  { if (paint(stage, overView, fresh)) { cancelAnimationFrame(ticker); announce(); } return; }
  if (game.state === 'arena') { if (paint(stage, arenaView, fresh)) watchArena(); return; }
  if (boardArena) { boardArena.stop(); boardArena = null; }
  if (!game.question) return;
  if (paint(stage, () => questionView(fresh), fresh)) { bindQuestion(); runTimer(); }
}

/* ── lobby ─────────────────────────────────────── */
function lobbyView() {
  const root = el('div', { class: 'lobby' });

  const bar = el('div', { class: 'joinbar' });
  bar.innerHTML = `
    <div class="lobby-art">${Sprite.scene(game.mode, 190)}</div>
    <div style="flex:1">
      <div class="lab">Playing</div>
      <div class="where">${esc((game.modeInfo && game.modeInfo.label) || 'Normal')}</div>
      <div class="lab" style="margin-top:10px">Join at</div>
      <div class="where" id="join-where">${esc(joinLabel())}</div>
    </div>
    <div style="text-align:center">
      <div class="lab">Game PIN</div>
      <div class="pinhuge">${esc(pin)}</div>
    </div>
    <div class="qrbox" id="qr" data-static></div>`;
  root.append(bar);

  const crowd = el('div', { class: 'crowd' });
  if (!game.players.length) {
    crowd.append(el('div', { class: 'nobody' },
      el('div', { class: 'mini-face', html: Sprite.icon('wave', 44) }),
      el('div', { style: 'margin-top:8px' }, 'Waiting for the class to join')));
  } else {
    game.players.forEach(p => crowd.append(el('div', { class: 'face ' + (game.mode === 'laser' ? p.team : '') },
      el('span', { class: 'av', html: Sprite.face(p.avatar, 40) }), p.name)));
  }
  root.append(crowd);

  root.append(el('div', { class: 'lobbybar' },
    el('button', { class: 'btn primary lg', id: 'start', disabled: hostToken ? null : true },
       el('span', { class: 'mini-face', html: Sprite.icon('play', 18) }), 'Start game'),
    el('button', { class: 'btn', id: 'cp' },
       el('span', { class: 'mini-face', html: Sprite.icon('copy', 16) }), 'Copy join link'),
    el('span', { class: 'mode-badge ' + (game.mode === 'laser' ? 'mode-laser' : 'mode-normal') },
       el('span', { class: 'mini-face', html: Sprite.icon((game.modeInfo && game.modeInfo.icon) || 'target', 18) }),
       (game.modeInfo && game.modeInfo.label) || 'Normal'),
    el('span', { class: 'muted' },
       `${game.players.length} player${game.players.length === 1 ? '' : 's'} · ${game.total} questions`),
    game.mode === 'laser'
      ? el('span', { class: 'tiny faint' }, 'Teams are balanced automatically. Players can swap before the start.')
      : ''));
  return root;
}

/* Bound once, when the lobby is first drawn: later polls only morph the roster,
 * so the buttons keep their handlers and the QR code is not redrawn every second. */
function bindLobby() {
  const url = joinUrl();
  $('#cp').onclick = () => copy(url);
  const startBtn = $('#start');
  if (startBtn) startBtn.onclick = async () => {
    if (!game.players.length) return toast('Wait for at least one player', 'bad');
    try { await api(`/games/${pin}/start`, { method: 'POST', body: { hostToken } }); }
    catch (err) { toast(err.message, 'bad'); }
  };
  drawQR(url);
}

/* Real, dependency-free QR of the join link — students can scan or type the PIN. */
function drawQR(url) {
  const host = document.getElementById('qr');
  if (!host) return;
  const code = window.QR && QR.svg(url, { size: 140 });
  host.innerHTML = code || `<div style="width:140px;height:140px;display:grid;place-items:center;color:#0b1020;
    font-weight:800;font-size:.72rem;text-align:center;padding:8px">Type the PIN<br>
    <span style="font-size:1.15rem">${esc(pin)}</span></div>`;
  host.insertAdjacentHTML('beforeend',
    '<div style="color:#0b1020;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-align:center;margin-top:4px">SCAN TO JOIN</div>');
}

/* ── the Laser Tag arena, on the big screen ────── */
let boardArena = null;

function arenaView() {
  const root = el('div', { class: 'board' });
  const panel = el('div', { class: 'ask' });
  panel.innerHTML = `<h1>Laser Tag</h1>
    <div class="tally"><b>${game.players.length}</b><span>in the arena</span></div>`;
  root.append(panel);
  root.append(el('div', { class: 'arena-board' }, el('canvas', { id: 'board-arena' })));
  // the arena is the thing worth watching, so the table stays short
  const rest = el('div', { class: 'rest' });
  rest.append(leaderboard({ rows: 4, title: 'Top of the arena' }));
  root.append(rest);
  if (hostToken) root.append(el('div', { class: 'row', style: 'justify-content:center;flex:none' },
    el('button', { class: 'btn lg primary', id: 'advance' }, 'Finish and show the scores')));
  return root;
}

function watchArena() {
  const canvas = document.getElementById('board-arena');
  if (!canvas || boardArena) return;
  // the board is a spectator: it draws everyone and controls nobody
  boardArena = NovaArena.start({ canvas, watching: true, send: () => {} });
  if (Nova.arenaListen) Nova.arenaListen(pin, (event, payload) => boardArena && boardArena.heard(event, payload));
  const advance = document.getElementById('advance');
  if (advance) advance.onclick = () => api(`/games/${pin}/end`, { method: 'POST', body: { hostToken } })
    .catch(e => toast(e.message, 'bad'));
}

/* ── question ──────────────────────────────────── */
function questionView(fresh) {
  const q = game.question;
  const revealing = game.state === 'reveal';
  const answered = game.players.filter(p => p.answered).length;
  const root = el('div', { class: 'board' + (revealing ? ' result' : '') });

  const ask = el('div', { class: 'ask' });
  ask.innerHTML = `
    <div class="dial" id="timer" data-static>
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" stroke="rgba(22,16,54,.12)" stroke-width="9" fill="none"></circle>
        <circle cx="50" cy="50" r="44" stroke="#6C4CF1" stroke-width="9" fill="none" stroke-linecap="round"
                id="tring" stroke-dasharray="276.5" stroke-dashoffset="0"></circle>
      </svg>
      <div class="num" id="tnum">&ndash;</div>
    </div>
    <h1>${esc(q.text || 'Question')}</h1>
    <div class="tally"><b>${answered}/${game.players.length}</b><span>answered</span></div>`;
  root.append(ask);

  const grid = el('div', { class: 'grid4' });
  if (q.type === 'short') {
    grid.classList.add('one');
    const tile = el('div', { class: 'tile a2', style: '--c:var(--sun)' });
    tile.innerHTML = `<span class="lbl">${revealing ? 'Answer: ' + esc(q.answer || '') : 'Everyone is typing an answer'}</span>`;
    grid.append(tile);
  } else {
    const total = Object.values(game.counts || {}).reduce((a, b) => a + b, 0) || 1;
    q.choices.forEach((c, i) => {
      const count = (game.counts || {})[c.id] || 0;
      const pct = revealing ? (count / total * 100) : 0;
      const tile = el('div', { class: `tile a${i % 6}` + (revealing ? (c.correct ? ' hit' : ' miss') : ''),
                               style: `animation-delay:${i * 55}ms` });
      tile.innerHTML = `<span class="sh">${SHAPES[i % 6]}</span>
        <span class="lbl">${esc(c.text || '')}</span>
        ${revealing ? `<span class="tick">&#10004;</span><span class="n">${count}</span>` : ''}
        <span class="fill" style="width:${fresh ? 0 : pct}%"></span>`;
      grid.append(tile);
      if (revealing && fresh) requestAnimationFrame(() => tile.querySelector('.fill').style.width = pct + '%');
    });
  }
  root.append(grid);

  if (revealing && q.explanation) root.append(el('p', { class: 'why' }, q.explanation));

  // the arena and the table belong to the moment the scores move, not to the question
  const rest = el('div', { class: 'rest', id: 'extra' });
  if (revealing) extraInto(rest);
  root.append(rest);

  if (hostToken) root.append(el('div', { class: 'row', style: 'justify-content:center;flex:none' },
    el('button', { class: 'btn lg' + (revealing ? ' primary' : ''), id: 'advance' },
       revealing ? (game.index + 1 >= game.total ? 'Final scores' : 'Next question') : 'Show the answer')));
  return root;
}

function bindQuestion() {
  const advance = document.getElementById('advance');
  if (advance) advance.onclick = () => api(`/games/${pin}/next`, { method: 'POST', body: { hostToken } }).catch(e => toast(e.message, 'bad'));
}

/* The ring is redrawn every frame rather than five times a second: at a distance a
 * stepping ring is the most obvious thing on the screen. */
function runTimer() {
  cancelAnimationFrame(ticker); clearInterval(ticker);
  const num = document.getElementById('tnum');
  const ring = document.getElementById('tring');
  const dial = document.getElementById('timer');
  if (!num) return;
  if (game.state !== 'question' || !game.endsAt) {
    num.innerHTML = Sprite.icon('tick', 34, '#161036'); dial?.classList.remove('low');
    if (ring) ring.style.strokeDashoffset = 276.5;
    return;
  }
  const limit = (game.question.time || 20) * 1000;
  let fired = false;
  const frame = () => {
    const left = Math.max(0, game.endsAt - (Date.now() + drift));
    num.textContent = Math.ceil(left / 1000);
    dial?.classList.toggle('low', left < 5200);
    if (ring) ring.style.strokeDashoffset = 276.5 * (1 - left / limit);
    if (left <= 0) {
      if (!fired && hostToken) { fired = true; api(`/games/${pin}/tick`, { method: 'POST', body: { hostToken } }).catch(() => {}); }
      return;
    }
    ticker = requestAnimationFrame(frame);
  };
  frame();
}

/* ── leaderboard / arena under the question ────── */
function extraInto(host) {
  if (!host) return;
  const views = { laser: arena, kart: raceTrack, tower: skyline, treasure: treasureBoard, boss: bossArena };
  const view = views[game.mode];
  // laser and boss carry their own standings, so a table underneath would repeat them
  if (view) host.append(view());
  if (!view || (game.mode !== 'laser' && game.mode !== 'boss')) host.append(leaderboard());
}


/* A tilted floor with figures standing on it. Every arena is built from this,
 * so a map only has to change the floor and the whole game changes with it. */
function stage(fill) {
  const box = el('div', { class: 'stage3d' });
  const world = el('div', { class: 'world map-' + (game.map || '') });
  const floor = el('div', { class: 'floor' });
  world.append(floor);
  fill(world, floor);
  box.append(world);
  return box;
}

/** One figure standing on the floor at x% across and y% back. */
function standing(p, x, y, label, extra) {
  const node = el('div', { class: 'figure' + (extra || ''), 'data-id': p.id,
    style: `left:${x}%;bottom:${y}%;margin-left:-26px` });
  node.append(el('div', { class: 'shadow' }),
              el('div', { class: 'mini-face', html: Sprite.face(p.avatar, 58) }),
              el('div', { class: 'tag' }, label));
  return node;
}

const KART_COLOURS = ['#F4364C', '#4F6BFF', '#FFC53D', '#12BE8E', '#6C4CF1', '#2BA8FF'];

function raceTrack() {
  const longest = Math.max(game.trackLength || 1000, ...game.players.map(p => p.distance || 0));
  return stage((world, floor) => {
    floor.append(el('div', { class: 'finish', style: 'right:2%' }));
    [22, 44, 66, 88].forEach(t => floor.append(el('div', { class: 'line', style: `top:${t}%` })));
    game.players.slice(0, 10).forEach((p, i) => {
      const pct = Math.min(94, (p.distance || 0) / longest * 92) + 2;
      const lane = 6 + i * (78 / Math.max(1, Math.min(10, game.players.length)));
      world.append(standing(p, pct, lane, `${p.name} · ${p.distance || 0}m`,
                            i === 0 ? ' lead' : ''));
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'No racers yet.'));
  });
}

function skyline() {
  const tallest = Math.max(6, ...game.players.map(p => p.blocks || 0));
  return stage((world) => {
    game.players.slice(0, 10).forEach((p, i) => {
      const x = 8 + i * (84 / Math.max(1, Math.min(10, game.players.length)));
      const node = el('div', { class: 'figure' + (i === 0 ? ' lead' : ''), 'data-id': p.id,
        style: `left:${x}%;bottom:14%;margin-left:-17px` });
      const stack = el('div', { class: 'pillar',
        style: `height:${Math.max(4, (p.blocks || 0) / tallest * 150)}px;--c:${KART_COLOURS[i % 6]}` });
      node.append(el('div', { class: 'shadow' }), stack,
                  el('div', { class: 'tag' }, `${p.name} · ${p.blocks || 0}`));
      world.append(node);
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'No builders yet.'));
  });
}

function treasureBoard() {
  const richest = Math.max(1, ...game.players.map(p => p.coins || 0));
  return stage((world) => {
    game.players.slice(0, 12).forEach((p, i) => {
      const x = 8 + (i % 6) * 16;
      const y = 12 + Math.floor(i / 6) * 34 + (p.coins || 0) / richest * 18;
      world.append(standing(p, x, y, `${p.name} · ${p.coins || 0}`, i === 0 ? ' lead' : ''));
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'No treasure hunters yet.'));
  });
}

function bossArena() {
  const boss = game.boss || { hp: 1, max: 1, name: 'The Boss', classHp: 100, classMax: 100 };
  const hurt = boss.hp < (lastBossHp ?? boss.hp);
  lastBossHp = boss.hp;

  const wrap = el('div', { class: 'boss-wrap' });
  wrap.append(stage((world) => {
    const beast = el('div', { class: 'figure boss-figure' + (hurt ? ' hurt' : ''),
      style: 'left:50%;bottom:72%;margin-left:-60px' });
    beast.append(el('div', { class: 'shadow', style: 'width:120px;height:14px' }),
                 el('div', { class: 'mini-face',
                             html: Sprite.icon(boss.hp > 0 ? 'dragon' : 'ghost', 120, '#7C4DFF') }),
                 el('div', { class: 'tag' }, `${boss.name} · ${boss.hp} HP`));
    world.append(beast);
    game.players.slice(0, 10).forEach((p, i) => {
      const x = 8 + i * (84 / Math.max(1, Math.min(10, game.players.length)));
      world.append(standing(p, x, 8, `${p.name} · ${p.score}`, i === 0 ? ' lead' : ''));
    });
  }));

  const bars = el('div', { class: 'card pad', style: 'margin-top:12px' });
  bars.append(el('div', { class: 'spread' },
      el('strong', {}, boss.hp > 0 ? boss.name : `${boss.name} is defeated`),
      el('span', { class: 'tiny faint' }, `${boss.hp} / ${boss.max} HP`)),
    el('div', { class: 'bar' }, el('i', { style: `width:${Math.max(0, boss.hp / boss.max * 100)}%` })),
    el('p', { class: 'tiny', style: 'margin-top:12px;font-weight:800' }, `Class health · ${boss.classHp}%`),
    el('div', { class: 'classbar' }, el('i', { style: `width:${boss.classHp}%` })));
  wrap.append(bars);
  return wrap;
}
let lastBossHp = null;

const unitFor = (p) => game.mode === 'kart' ? `${p.distance || 0}m`
  : game.mode === 'tower' ? `${p.blocks || 0} blocks`
  : game.mode === 'treasure' ? `${p.coins || 0} coins`
  : String(p.score);

/* Who climbed and who slipped. The comparison is against where everyone stood at
 * the previous question, captured once when that question's result first appeared:
 * comparing the current standings with themselves would always read "no change",
 * and re-capturing on every render would wipe the arrows a second after they showed. */
let prevRanks = {}, thisRanks = null, ranksFor = -1;
function rankBaseline() {
  if (game.state === 'reveal' && ranksFor !== game.index) {
    if (thisRanks) prevRanks = thisRanks;          // last question's finish is the new baseline
    thisRanks = {};
    game.players.forEach((p, i) => { thisRanks[p.id] = i; });
    ranksFor = game.index;
  }
  return prevRanks;
}

function leaderboard({ from = 0, title, rows = 8 } = {}) {
  const card = el('div', { class: 'card pad', style: 'margin-top:14px' },
    el('h3', { style: 'font-size:1.05rem;margin-bottom:14px' },
      title || (game.mode === 'boss' ? 'Damage dealt' : 'Leaderboard')));
  const lb = el('div', { class: 'lb' });
  const baseline = rankBaseline();
  game.players.slice(from, from + rows).forEach((p, offset) => {
    const i = from + offset;
    const was = baseline[p.id];
    const moved = was === undefined ? 0 : was - i;
    lb.append(el('div', { class: 'lb-row' + (i === 0 ? ' top' : ''), 'data-id': p.id },
      el('span', { class: 'rank' }, '#' + (i + 1)),
      el('span', { class: 'move ' + (moved > 0 ? 'up' : moved < 0 ? 'down' : 'same') },
         moved > 0 ? '▲' + moved : moved < 0 ? '▼' + (-moved) : '·'),
      el('span', { class: 'mini-face', html: Sprite.face(p.avatar, 30) }),
      el('span', {}, p.name),
      p.streak >= 3 ? el('span', { class: 'chip warn' },
         el('span', { class: 'mini-face', html: Sprite.icon('flame', 14) }), String(p.streak)) : '',
      p.answered && game.state === 'question' ? el('span', { class: 'chip live' }, 'in') : '',
      el('span', { class: 'score' }, unitFor(p))));
  });
  if (game.players.length <= from) lb.append(el('p', { class: 'faint tiny' }, 'Nobody else.'));
  card.append(lb);
  return card;
}

function arena() {
  const wrap = el('div', {});
  const sides = { red: game.players.filter(p => p.team === 'red'),
                  blue: game.players.filter(p => p.team === 'blue') };
  const maxHp = (side) => Math.max(100, 100 * sides[side].length);

  wrap.append(stage((world, floor) => {
    floor.append(el('div', { class: 'line', style: 'top:50%;background:rgba(255,255,255,.3)' }));
    ['red', 'blue'].forEach((side) => {
      const back = side === 'red';
      sides[side].slice(0, 8).forEach((p, i) => {
        const x = 10 + i * (80 / Math.max(1, sides[side].length));
        const node = standing(p, x, back ? 66 : 8,
          p.down ? `${p.name} · down` : `${p.name} · ${p.hp}`,
          (p.down ? ' downed' : '') + (lastHp[p.id] !== undefined && p.hp < lastHp[p.id] ? ' hit' : ''));
        lastHp[p.id] = p.hp;
        world.append(node);
        // the shot that just landed, drawn flat on the floor from shooter to target
        if (game.state === 'reveal' && p.correct && !p.down) {
          const foes = sides[side === 'red' ? 'blue' : 'red'];
          const aim = foes.find(f => f.id === p.target) || foes[0];
          if (aim) {
            const j = foes.indexOf(aim);
            const tx = 10 + j * (80 / Math.max(1, foes.length));
            const ty = back ? 8 : 66;
            const dx = tx - x, dy = (back ? 66 : 8) - ty;      // in floor percentages
            const angle = Math.atan2(dy * 0.42, dx) * 180 / Math.PI;   // the floor is wider than deep
            world.append(el('div', { class: 'beam', style:
              `left:${x}%;bottom:${(back ? 68 : 10)}%;width:${Math.hypot(dx, dy * 0.42)}%;` +
              `--a:${angle}deg;transform:rotate(${angle}deg)` }));
          }
        }
      });
    });
  }));

  const bars = el('div', { class: 'card pad', style: 'margin-top:12px' });
  ['red', 'blue'].forEach(side => {
    const team = game.teams[side];
    bars.append(el('div', { class: 'spread', style: 'margin-top:6px' },
      el('strong', {}, team.name + (side === 'red' ? '' : '')),
      el('span', { class: 'tiny faint' }, `${Math.max(0, team.hp)} HP`)));
    bars.append(el('div', { class: 'hpbar' }, el('i', {
      style: `width:${Math.max(0, team.hp / maxHp(side) * 100)}%;background:${side === 'red'
        ? 'linear-gradient(90deg,#ff4d5e,#ff9b6a)' : 'linear-gradient(90deg,#4f6bff,#22d3ee)'}` })));
  });
  wrap.append(bars);

  const feed = el('div', { class: 'feed' });
  (game.lastEvents || []).slice().reverse().forEach(line => feed.append(el('div', {}, line)));
  if (!game.lastEvents?.length) feed.append(el('div', { class: 'faint' },
    'Line up a shot in the countdown, then answer to fire it.'));
  wrap.append(feed);
  return wrap;
}

/* ── final ─────────────────────────────────────── */
/* Third, then second, then first: the order a hall announces them in, each one
 * stepping into a light. The winner's name is held back until the end. */
function announce() {
  const crown = document.querySelector('.crown');
  const line = crown && crown.querySelector('h1');
  const winner = line ? line.textContent : '';
  if (line) { line.textContent = 'And the places are'; crown.classList.add('hush'); }

  const step = (place, delay) => setTimeout(() => {
    const node = document.querySelector(`.stand[data-place="${place}"]`);
    if (node) node.classList.add('up');
    if (place === 1) {
      if (line) { line.textContent = winner; crown.classList.remove('hush'); }
      confetti(160);
    }
  }, delay);
  step(3, 500); step(2, 1900); step(1, 3300);
}

function overView() {
  const top = game.players.slice(0, 3);
  const root = el('div', { class: 'finale' });

  let headline = 'Final scores', sub = game.quizTitle;
  if (game.mode === 'laser') {
    const red = game.teams.red, blue = game.teams.blue;
    const winner = red.hp === blue.hp ? null : (red.hp > blue.hp ? red : blue);
    headline = winner ? `${winner.name} wins` : 'A draw';
    sub = `${red.name} ${Math.max(0, red.hp)} HP · ${blue.name} ${Math.max(0, blue.hp)} HP`;
  } else if (game.mode === 'boss') {
    const boss = game.boss || { hp: 0, name: 'The boss' };
    headline = boss.hp === 0 ? `The class beat ${boss.name}` : `${boss.name} survived`;
    sub = boss.hp === 0 ? 'Every right answer landed a blow.' : `${boss.hp} HP left. Closer next lesson.`;
  } else if (top[0]) {
    const win = { kart: `${top[0].distance}m driven`, tower: `${top[0].blocks} blocks high`,
                  treasure: `${top[0].coins} coins` }[game.mode];
    headline = `${top[0].name} wins`;
    sub = win || `${top[0].score} points`;
  }
  // announce() rewrites this line as the places go up, so the update pass leaves
  // it alone; otherwise the headline snapped back to the winner a second in
  const crown = el('div', { class: 'crown', 'data-static': '' });
  crown.append(el('h1', {}, headline), el('p', {}, sub));
  root.append(crown);

  // announce() owns this once it is on screen: data-static keeps the update pass
  // from stripping the classes that light each place up
  const podium = el('div', { class: 'podium', 'data-static': '' });
  [top[1], top[0], top[2]].forEach((p) => {
    if (!p) return;
    const place = p === top[0] ? 1 : p === top[1] ? 2 : 3;
    podium.append(el('div', { class: 'stand p' + place, 'data-place': place },
      el('div', { class: 'spot' }),
      el('div', { class: 'medal', html: Sprite.icon('medal', 30, place === 1 ? '#E8A400' : place === 2 ? '#93A0BC' : '#B4713A') }),
      el('div', { class: 'mini-face', html: Sprite.face(p.avatar, 54) }),
      el('div', { class: 'who' }, p.name),
      el('div', { class: 'pts' }, game.mode === 'laser' ? p.score + ' dmg' : unitFor(p))));
  });
  root.append(podium);

  const rest = el('div', { class: 'rest' });
  if (game.players.length > 3) rest.append(leaderboard({ from: 3, title: 'Everyone else' }));
  root.append(rest);

  root.append(el('div', { class: 'row', style: 'justify-content:center;gap:10px;flex:none' },
    el('a', { class: 'btn', href: '/quiz' }, 'Back to quizzes'),
    el('button', { class: 'btn primary', onclick: () => location.href = '/studio?id=' + (game.quizId || '') }, 'Edit this quiz')));
  return root;
}

$('#end').onclick = () => {
  if (!hostToken) return toast('Only the host device can end the game', 'bad');
  const close = modal(`
    <h2 style="margin-bottom:6px">End the game?</h2>
    <p class="muted" style="margin-bottom:20px">Everyone stops where they are and the final scores go up.</p>
    <div class="row" style="justify-content:flex-end;gap:10px">
      <button class="btn" id="no">No, keep playing</button>
      <button class="btn primary" id="yes">Yes, end it</button>
    </div>`, {
    onMount(box) {
      box.querySelector('#no').onclick = () => close();
      box.querySelector('#yes').onclick = async () => {
        close();
        try { await api(`/games/${pin}/end`, { method: 'POST', body: { hostToken } }); }
        catch (err) { toast(err.message, 'bad'); }
      };
    }
  });
};

api(`/games/${pin}`).then(apply).catch(fail);
connect();
</script>
