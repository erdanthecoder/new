# One-click deploy on Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: quiznova
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 128 --worker-class gthread --timeout 120 --keep-alive 70 --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Optional: set this in the dashboard to switch the AI co-pilot from its
      # built-in question bank to live Claude. Leave unset and everything still works.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Where quizzes live. Without these the app writes to a file on the server —
      # and free hosts wipe that file every time the service sleeps. With them,
      # quizzes and results survive sleeps, restarts and redeploys.
      #
      # The project URL is not a secret, so it is set here and needs no dashboard
      # work. The service_role key IS a secret and this repository is public, so
      # it must be pasted into Render → Environment by the account owner.
      - key: SUPABASE_URL
        value: https://blkwilonabowayxefxpx.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
